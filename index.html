<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizProfit Pro</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 10px; font-size: 14px; color: #444; }
    input, select, button { width: 100%; padding: 12px; margin: 4px 0; font-size: 16px; box-sizing: border-box; }
    #mesej { font-weight: bold; }
    ul { padding-left: 18px; }
    li { margin-bottom: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>BizProfit Pro</h1>

  <div id="skrin-login">
    <input id="emel" type="email" placeholder="Emel" autocomplete="username">
    <input id="katalaluan" type="password" placeholder="Kata laluan" autocomplete="current-password">
    <button id="btn-login">Log masuk</button>
  </div>

  <div id="skrin-app" hidden>
    <p id="status"></p>
    <button id="btn-logout">Log keluar</button>

    <h2>Tambah transaksi</h2>
    <p id="outlet-nama"></p>

    <label for="tarikh">Tarikh</label>
    <input id="tarikh" type="date">

    <label for="jenis">Jenis</label>
    <select id="jenis">
      <option value="In">Duit masuk (In)</option>
      <option value="Out">Duit keluar (Out)</option>
    </select>

    <label for="kategori">Kategori</label>
    <select id="kategori"></select>

    <label for="jumlah">Jumlah (RM)</label>
    <input id="jumlah" type="number" inputmode="decimal" step="0.01" min="0.01">

    <label for="bayaran">Cara bayaran</label>
    <select id="bayaran"></select>

    <label for="keterangan">Keterangan</label>
    <input id="keterangan" type="text" maxlength="200">

    <label for="rujukan">No. rujukan (pilihan)</label>
    <input id="rujukan" type="text" maxlength="50">

    <button id="btn-simpan">Simpan transaksi</button>

    <h2>5 transaksi terkini</h2>
    <ul id="senarai"></ul>
  </div>

  <p id="mesej"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    let profil = null;
    let semuaKategori = [];

    function pesan(teks, ok) {
      $("mesej").textContent = teks;
      $("mesej").style.color = ok ? "#0a7d2c" : "#b00020";
    }

    function isiPilihan(pilihan, senarai) {
      pilihan.replaceChildren(...senarai.map((nama) => {
        const o = document.createElement("option");
        o.value = nama;
        o.textContent = nama;
        return o;
      }));
    }

    function isiKategori() {
      const jenis = $("jenis").value;
      isiPilihan($("kategori"), semuaKategori.filter((k) => k.type === jenis).map((k) => k.name));
    }

    async function muatSenarai() {
      const { data, error } = await sb.from("transactions")
        .select("transaction_date,type,category,amount,description")
        .eq("outlet_id", profil.outlet_id)
        .order("created_at", { ascending: false })
        .limit(5);
      if (error) { pesan("Gagal baca senarai transaksi."); return; }
      $("senarai").replaceChildren(...data.map((t) => {
        const li = document.createElement("li");
        li.textContent = t.transaction_date + " | " + t.type + " | " + t.category +
          " | RM " + Number(t.amount).toFixed(2) + " | " + t.description;
        return li;
      }));
    }

    async function papar() {
      const { data: { session } } = await sb.auth.getSession();
      $("skrin-login").hidden = !!session;
      $("skrin-app").hidden = !session;
      if (!session) return;

      const { data: p, error: e1 } = await sb.from("staff_profiles")
        .select("role,outlet_id").eq("user_id", session.user.id).maybeSingle();
      const { data: outlet, error: e2 } = await sb.from("outlets").select("id,name");
      const { data: kat, error: e3 } = await sb.from("categories").select("key,name,type").order("key");
      const { data: bayar, error: e4 } = await sb.from("payment_methods").select("name");
      if (e1 || e2 || e3 || e4) { pesan("Gagal baca data."); return; }
      if (!p) { pesan("Akaun ini belum didaftar sebagai staff."); return; }

      profil = p;
      semuaKategori = kat;
      const sendiri = outlet.find((o) => o.id === p.outlet_id);

      $("status").textContent = "Log masuk: " + session.user.email +
        " | Role: " + p.role + " | Outlet nampak: " + outlet.length;
      $("outlet-nama").textContent = "Outlet: " + (sendiri ? sendiri.name : "tidak diketahui");
      $("tarikh").value = new Date().toLocaleDateString("sv-SE");
      isiKategori();
      isiPilihan($("bayaran"), bayar.map((b) => b.name));
      muatSenarai();
    }

    $("jenis").onchange = isiKategori;

    $("btn-login").onclick = async () => {
      pesan("");
      const { error } = await sb.auth.signInWithPassword({
        email: $("emel").value.trim(),
        password: $("katalaluan").value
      });
      if (error) { pesan("Emel atau kata laluan salah."); return; }
      $("katalaluan").value = "";
      papar();
    };

    $("btn-logout").onclick = async () => {
      await sb.auth.signOut();
      profil = null;
      pesan("");
      papar();
    };

    $("btn-simpan").onclick = async () => {
      pesan("");
      const jumlah = Number($("jumlah").value);
      const keterangan = $("keterangan").value.trim();
      if (!$("tarikh").value) { pesan("Pilih tarikh."); return; }
      if (!(jumlah > 0)) { pesan("Jumlah mesti lebih dari 0."); return; }
      if (!keterangan) { pesan("Isi keterangan."); return; }

      $("btn-simpan").disabled = true;
      const { error } = await sb.from("transactions").insert({
        transaction_date: $("tarikh").value,
        type: $("jenis").value,
        category: $("kategori").value,
        amount: Math.round(jumlah * 100) / 100,
        description: keterangan,
        payment_method: $("bayaran").value,
        reference_no: $("rujukan").value.trim() || null,
        outlet_id: profil.outlet_id
      });
      $("btn-simpan").disabled = false;

      if (error) { pesan("Gagal simpan: " + error.message); return; }
      $("jumlah").value = "";
      $("keterangan").value = "";
      $("rujukan").value = "";
      pesan("Transaksi disimpan.", true);
      muatSenarai();
    };

    papar();
  </script>
</body>
</html>
