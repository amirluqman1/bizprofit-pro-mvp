  <style>
    /* BIZPROFIT PRO · Forest & Paper
       Semua gaya disimpan di sini. Tiada Tailwind runtime diperlukan.

    :root {
      color-scheme: light;

      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --serif: "Instrument Serif", Georgia, serif;
      --content: 560px;
      --ease: cubic-bezier(.2,.75,.25,1);
      font-family: var(--sans);
      color: var(--ink);

      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; min-height: 100dvh; background-image: linear-gradient(90deg, #8a9a8010 1px, transparent 1px); background-size: 80px 100%; }
    [hidden] { display: none !important; }

    h1, h2, p { margin: 0; }

    legend { padding: 0; }
    a { color: inherit; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .icon { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
