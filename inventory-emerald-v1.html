<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a1f">
<title>BizProfit Pro · Smart Inventori</title>
<style>
:root{
  color-scheme:dark;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;
  --bg:#08201a;--panel:#0f2f24;--card:#164a37;--card-line:#2a6a50;--field:#1b5540;
  --text:#f2f8f3;--muted:#a9c9b6;--mint:#a3f0b8;
  --red:#ff7a6b;--red-bg:#5a2a26;--amber:#f7c56b;--amber-bg:#4d3d1c;--green:#5fe08a;--green-bg:#1d5a39;
  background:var(--bg);color:var(--text)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b2a1f,#061812)}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.shell{max-width:620px;margin:auto;padding:20px 16px 90px}
.panel{background:var(--panel);border:1px solid #1f4a3a;border-radius:28px;padding:22px 18px}

/* Kepala */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.overline{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
h1{margin:6px 0 0;font-size:clamp(28px,7vw,36px);letter-spacing:-.03em;line-height:1.1}
.icon-tile{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--card);color:var(--mint);flex:0 0 auto}
.icon-tile svg{width:22px;height:22px}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 0;font-size:12px;color:var(--muted)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;color:var(--mint);font-weight:700;font-size:12px;padding:6px 0}

/* Outlet */
.outlet{position:relative;margin-top:16px;background:var(--card);border-radius:20px;padding:14px 18px}
.outlet label{display:block;font-size:13px;color:var(--muted)}
.outlet select{appearance:none;-webkit-appearance:none;width:100%;margin-top:4px;padding:2px 30px 2px 0;border:0;background:transparent;color:var(--text);font-size:20px;font-weight:800;outline:none}
.outlet select:disabled{opacity:1;cursor:default}
.outlet .chev{position:absolute;right:18px;top:50%;width:18px;height:18px;transform:translateY(-10%);color:var(--muted);pointer-events:none}
.outlet option{background:var(--panel);color:var(--text)}

.alert{margin-top:14px;padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.55;background:var(--amber-bg);color:var(--amber)}
.alert.danger{background:var(--red-bg);color:#ffc2b8}

/* Bahagian senarai */
.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.section h2{margin:0;font-size:16px;font-weight:600;color:#d7ebdf}
.tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.btn{border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid transparent}
.btn.mint{background:var(--mint);color:#0b3021}
.btn.ghost{background:transparent;border-color:var(--card-line);color:var(--text)}
.btn.white{background:#fff;color:#0b2a1f}

/* Kad barang */
.item{margin-top:14px;background:var(--card);border:1px solid var(--card-line);border-radius:24px;padding:18px 18px 16px}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-name{background:none;border:0;padding:0;color:inherit;text-align:left;min-width:0}
.item-name h3{margin:0;font-size:20px;font-weight:800;overflow-wrap:anywhere}
.sub{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.pill{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
.pill.habis{color:var(--red);background:var(--red-bg)}
.pill.rendah{color:var(--red);background:var(--red-bg)}
.pill.ok{color:var(--green);background:var(--green-bg)}
.item-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.qty{background:none;border:0;padding:0;color:var(--text);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;text-align:left}
.qty small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.saving{display:block;margin-top:4px;font-size:11px;color:var(--muted);min-height:14px}
.steppers{display:flex;gap:12px;flex:0 0 auto}
.step{width:60px;height:46px;border-radius:999px;font-size:24px;line-height:1;display:grid;place-items:center}
.step.minus{background:transparent;border:1.5px solid var(--card-line);color:var(--text)}
.step.plus{background:#fff;border:0;color:#0b2a1f}
.empty{margin-top:14px;padding:22px;border:1px dashed var(--card-line);border-radius:20px;text-align:center;color:var(--muted);font-size:14px}

/* Borang & dialog */
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--card-line);border-radius:14px;background:var(--field);color:var(--text);padding:13px;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--mint)}
dialog{width:min(460px,calc(100% - 24px));border:1px solid var(--card-line);border-radius:24px;background:var(--panel);color:var(--text);padding:20px}
dialog::backdrop{background:#000b}
dialog h2{margin:0 0 4px;font-size:20px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.dialog-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.log{padding:10px 0;border-bottom:1px solid #ffffff14;font-size:14px;line-height:1.5}
.log:last-child{border-bottom:0}
.log span{font-size:12px;color:var(--muted)}
#message{min-height:20px;margin-top:14px;font-size:13px;color:var(--amber);text-align:center}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
@media(max-width:360px){.step{width:50px;height:42px}.qty{font-size:34px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <div class="head">
      <div><div class="overline">BIZPROFIT PRO</div><h1>Smart Inventori</h1></div>
      <span class="icon-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg></span>
    </div>

    <!-- Log masuk -->
    <section id="loginBox" class="hidden" style="margin-top:18px">
      <form id="loginForm" class="stack">
        <p class="note">Log masuk dengan akaun BizProfit Pro anda.</p>
        <label class="field">Email<input id="email" type="email" autocomplete="username" required></label>
        <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn mint">Log masuk</button>
      </form>
    </section>

    <!-- App -->
    <section id="app" class="hidden">
      <div class="who"><span id="identity"></span><button class="link" id="logout" type="button">Log keluar</button></div>

      <div class="outlet">
        <label for="outlet">Outlet</label>
        <select id="outlet"></select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div id="alert" class="alert hidden" role="status"></div>

      <div class="section">
        <h2>Stok Bahan Mentah</h2>
        <button class="btn white" id="openAdd" type="button">+ Tambah</button>
      </div>
      <div class="tools">
        <button class="btn mint" id="copyList" type="button">Copy senarai beli</button>
        <button class="btn ghost" id="copyCsv" type="button">CSV</button>
        <button class="btn ghost" id="refresh" type="button" aria-label="Muat semula">↻</button>
      </div>

      <div id="items"></div>
    </section>

    <div id="message" role="status" aria-live="polite"></div>
  </div>
  <p class="foot">Tekan nombor untuk taip jumlah tepat. Setiap perubahan direkod.</p>
</div>

<!-- Tambah barang -->
<dialog id="addDialog">
  <form id="addForm" class="stack">
    <h2>Tambah barang</h2>
    <p class="note">Selepas disimpan, hanya owner boleh ubah nama, unit atau "patut ada".</p>
    <label class="field">Nama barang<input id="name" required maxlength="120" placeholder="Contoh: Ayam fillet"></label>
    <label class="field">Unit<select id="unit"><option>kg</option><option>pcs</option><option>biji</option><option>pack</option><option>liter</option><option>g</option></select></label>
    <div class="two">
      <label class="field">Berapa ada<input id="current" type="number" inputmode="decimal" min="0" step="any" value="0" required></label>
      <label class="field">Patut ada<input id="target" type="number" inputmode="decimal" min="0" step="any" placeholder="20" required></label>
    </div>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" data-close="addDialog">Batal</button>
      <button class="btn mint" id="addBtn">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Kemas kini / Edit -->
<dialog id="editDialog">
  <form id="editForm" class="stack">
    <h2 id="editTitle"></h2>
    <label class="field">Berapa ada sekarang<input id="editCurrent" type="number" inputmode="decimal" min="0" step="any" required></label>
    <div id="ownerFields" class="stack">
      <label class="field">Nama barang<input id="editName" maxlength="120"></label>
      <div class="two">
        <label class="field">Unit<select id="editUnit"><option>kg</option><option>pcs</option><option>biji</option><option>pack</option><option>liter</option><option>g</option></select></label>
        <label class="field">Patut ada<input id="editTarget" type="number" inputmode="decimal" min="0" step="any"></label>
      </div>
    </div>
    <p id="editNote" class="note"></p>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" id="openHistory">Sejarah</button>
      <button class="btn ghost" type="button" data-close="editDialog">Batal</button>
      <button class="btn mint" id="editSave">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Sejarah -->
<dialog id="historyDialog">
  <div class="section" style="margin:0"><h2 id="historyTitle"></h2><button class="btn ghost" type="button" data-close="historyDialog">Tutup</button></div>
  <div id="historyList" style="margin-top:10px"></div>
</dialog>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let sb, user, profile, items = [], editing = null;
const people = new Map();
const pending = new Map();      // id -> timer, untuk simpan selepas tekan +/− berhenti
const SAVE_DELAY = 3000;

const say = t => { $('message').textContent = t; };
const safe = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n).toLocaleString('ms-MY', {maximumFractionDigits: 3});
const selected = () => $('outlet').value;
const isOwner = () => profile?.role === 'owner';
const canSeeLogs = () => profile?.role === 'owner' || profile?.role === 'manager';
const roleName = r => ({owner: 'Owner', manager: 'Manager', staff: 'Staff'}[r] || r);
const validQty = v => Number.isFinite(v) && v >= 0;
const findItem = id => items.find(x => x.id === id);

// Satu nombor "patut ada": Habis = 0, Stok rendah = kurang dari patut ada.
function status(x) {
  const ada = Number(x.current_qty), patut = Number(x.target_qty);
  if (ada <= 0) return 'habis';
  if (ada < patut) return 'rendah';
  return 'ok';
}
const statusLabel = {habis: 'Habis', rendah: 'Stok rendah', ok: 'Stok OK'};
const statusOrder = {habis: 0, rendah: 1, ok: 2};
const kurangOf = x => Math.max(0, Number(x.target_qty) - Number(x.current_qty));

function errorText(error) {
  if (error?.code === '23505') return 'Nama barang ini dah wujud dalam outlet ni.';
  return error?.message || 'Ralat tidak diketahui.';
}

// ---------- Mula ----------
async function start() {
  if (typeof SUPABASE_URL !== 'string' || typeof SUPABASE_KEY !== 'string') {
    say('config.js tidak dijumpai. Letakkan fail ini bersama config.js asal.'); return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data: {session}} = await sb.auth.getSession();
  if (session) await loadAccount(session.user);
  else $('loginBox').classList.remove('hidden');
}

async function loadAccount(u) {
  user = u;
  const {data: p, error: pe} = await sb.from('staff_profiles').select('role,outlet_id').eq('user_id', u.id).maybeSingle();
  if (pe || !p) { say('Akaun ini belum didaftarkan ke mana-mana outlet. Hubungi owner.'); return; }
  profile = p;

  const {data: outlets, error: oe} = await sb.from('outlets').select('id,name').order('name');
  if (oe) { say(oe.message); return; }
  const allowed = isOwner() ? outlets : (outlets || []).filter(o => o.id === p.outlet_id);
  $('outlet').replaceChildren(...allowed.map(o => {
    const opt = document.createElement('option');
    opt.value = o.id; opt.textContent = o.name;
    return opt;
  }));
  if (p.outlet_id && allowed.some(o => o.id === p.outlet_id)) $('outlet').value = p.outlet_id;
  $('outlet').disabled = allowed.length < 2;
  document.querySelector('.outlet .chev').classList.toggle('hidden', allowed.length < 2);

  const {data: staff} = await sb.from('staff_profiles').select('user_id,role');
  (staff || []).forEach(s => people.set(s.user_id, s.role));

  $('identity').textContent = `${u.email} · ${roleName(p.role)}`;
  $('loginBox').classList.add('hidden');
  $('app').classList.remove('hidden');
  if (!allowed.length) { say('Tiada outlet yang boleh diakses.'); return; }
  await refresh();
}

async function refresh() {
  if (!selected()) return;
  await flushAll();
  const {data, error} = await sb.from('inventory_items')
    .select('id,outlet_id,name,unit,current_qty,target_qty,updated_at')
    .eq('outlet_id', selected());
  if (error) { say('Gagal baca stok: ' + error.message); return; }
  items = (data || []).sort((a, b) =>
    statusOrder[status(a)] - statusOrder[status(b)] || a.name.localeCompare(b.name, 'ms-MY'));
  renderAll();
}

// ---------- Paparan ----------
function cardHTML(x) {
  const st = status(x);
  return `<div class="item" data-id="${safe(x.id)}">
    <div class="item-top">
      <button class="item-name" type="button" data-open="${safe(x.id)}">
        <h3>${safe(x.name)}</h3>
        <span class="sub">Patut ada ${num(x.target_qty)} ${safe(x.unit)}</span>
      </button>
      <span class="pill ${st}">${statusLabel[st]}</span>
    </div>
    <div class="item-bottom">
      <div>
        <button class="qty" type="button" data-open="${safe(x.id)}" aria-label="Taip jumlah ${safe(x.name)}">${num(x.current_qty)}<small>${safe(x.unit)}</small></button>
        <span class="saving" data-saving="${safe(x.id)}"></span>
      </div>
      <div class="steppers">
        <button class="step minus" type="button" data-step="-1" data-id="${safe(x.id)}" aria-label="Kurang satu ${safe(x.name)}" ${Number(x.current_qty) <= 0 ? 'disabled' : ''}>−</button>
        <button class="step plus" type="button" data-step="1" data-id="${safe(x.id)}" aria-label="Tambah satu ${safe(x.name)}">+</button>
      </div>
    </div>
  </div>`;
}

function renderAll() {
  renderSummary();
  $('items').innerHTML = items.length
    ? items.map(cardHTML).join('')
    : '<div class="empty">Belum ada barang dalam outlet ini.<br>Tekan <b>+ Tambah</b> untuk mula.</div>';
}

// Kemas kini satu kad sahaja (tidak susun semula semasa orang tengah tekan).
function renderCard(id, savingText) {
  const x = findItem(id);
  const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (!x || !el) return;
  el.outerHTML = cardHTML(x);
  if (savingText !== undefined) setSaving(id, savingText);
  renderSummary();
}
function setSaving(id, text) {
  const el = document.querySelector(`[data-saving="${CSS.escape(id)}"]`);
  if (el) el.textContent = text;
}

function renderSummary() {
  const habis = items.filter(x => status(x) === 'habis').length;
  const rendah = items.filter(x => status(x) === 'rendah').length;
  const parts = [];
  if (habis) parts.push(`${habis} barang habis`);
  if (rendah) parts.push(`${rendah} stok rendah`);
  const alert = $('alert');
  alert.textContent = parts.length ? '⚠ ' + parts.join(', ') + '.' : '';
  alert.classList.toggle('hidden', !parts.length);
  alert.classList.toggle('danger', habis > 0);
}

// ---------- Butang − / + ----------
$('items').addEventListener('click', e => {
  const step = e.target.closest('[data-step]');
  if (step) { bump(step.dataset.id, Number(step.dataset.step)); return; }
  const open = e.target.closest('[data-open]');
  if (open) openEdit(findItem(open.dataset.open));
});

function bump(id, delta) {
  const x = findItem(id);
  if (!x) return;
  if (!pending.has(id)) x._saved = Number(x.current_qty);   // nilai terakhir yang tersimpan
  x.current_qty = Math.max(0, Math.round((Number(x.current_qty) + delta) * 1000) / 1000);
  clearTimeout(pending.get(id));
  pending.set(id, setTimeout(() => save(id), SAVE_DELAY));
  renderCard(id, 'Belum disimpan…');
}

async function save(id) {
  clearTimeout(pending.get(id));
  pending.delete(id);
  const x = findItem(id);
  if (!x) return;
  if (Number(x.current_qty) === x._saved) { setSaving(id, ''); return; }
  setSaving(id, 'Menyimpan…');
  const {data, error} = await sb.from('inventory_items').update({current_qty: x.current_qty})
    .eq('id', id).eq('outlet_id', x.outlet_id).select('id');
  if (error || !data || !data.length) {
    x.current_qty = x._saved;
    renderCard(id, '');
    say(error ? 'Gagal simpan: ' + errorText(error) : 'Tiada akses untuk ubah barang ini.');
    return;
  }
  x._saved = Number(x.current_qty);
  renderCard(id, '✓ Disimpan');
  setTimeout(() => setSaving(id, ''), 1800);
}

function flushAll() { return Promise.all([...pending.keys()].map(save)); }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);

// ---------- Tambah barang ----------
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $(b.dataset.close).close()));
$('openAdd').onclick = () => { $('addForm').reset(); $('addDialog').showModal(); $('name').focus(); };

$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    outlet_id: selected(),
    name: $('name').value.trim(),
    unit: $('unit').value,
    current_qty: Number($('current').value),
    target_qty: Number($('target').value)
  };
  if (!payload.name) { say('Isi nama barang.'); return; }
  if ($('target').value.trim() === '' || !validQty(payload.current_qty) || !validQty(payload.target_qty)) {
    say('Sila masukkan kuantiti yang sah (0 atau lebih).'); return;
  }
  const b = $('addBtn');
  b.disabled = true;
  const {error} = await sb.from('inventory_items').insert(payload);
  b.disabled = false;
  if (error) { say('Gagal tambah: ' + errorText(error)); return; }
  $('addDialog').close();
  say('Barang berjaya ditambah.');
  await refresh();
});

// ---------- Kemas kini / Edit ----------
function openEdit(item) {
  if (!item) return;
  editing = item;
  $('editTitle').textContent = item.name;
  $('editCurrent').value = item.current_qty;
  $('ownerFields').classList.toggle('hidden', !isOwner());
  ['editName', 'editTarget'].forEach(id => { $(id).required = isOwner(); });
  if (isOwner()) {
    $('editName').value = item.name;
    if (![...$('editUnit').options].some(o => o.value === item.unit)) $('editUnit').add(new Option(item.unit, item.unit));
    $('editUnit').value = item.unit;
    $('editTarget').value = item.target_qty;
  }
  $('editNote').textContent = isOwner()
    ? 'Setiap perubahan kuantiti direkod dalam sejarah.'
    : `Patut ada: ${num(item.target_qty)} ${item.unit}. Hanya owner boleh ubah nama, unit atau patut ada.`;
  $('openHistory').classList.toggle('hidden', !canSeeLogs());
  $('editDialog').showModal();
}

$('editForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!editing) return;
  await flushAll();
  const payload = {current_qty: Number($('editCurrent').value)};
  if ($('editCurrent').value.trim() === '' || !validQty(payload.current_qty)) { say('Kuantiti tidak sah.'); return; }
  if (isOwner()) {
    payload.name = $('editName').value.trim();
    payload.unit = $('editUnit').value;
    payload.target_qty = Number($('editTarget').value);
    if (!payload.name || !validQty(payload.target_qty)) { say('Nama atau patut ada tidak sah.'); return; }
  }
  const b = $('editSave');
  b.disabled = true;
  const {data, error} = await sb.from('inventory_items').update(payload)
    .eq('id', editing.id).eq('outlet_id', editing.outlet_id).select('id');
  b.disabled = false;
  if (error) { say('Gagal simpan: ' + errorText(error)); return; }
  if (!data || !data.length) { say('Tiada perubahan disimpan. Anda mungkin tiada akses untuk barang ini.'); return; }
  $('editDialog').close();
  say('Stok berjaya dikemas kini.');
  await refresh();
});

// ---------- Sejarah (owner & manager) ----------
$('openHistory').onclick = async () => {
  const item = editing;
  if (!item || !canSeeLogs()) return;
  $('editDialog').close();
  $('historyTitle').textContent = 'Sejarah · ' + item.name;
  $('historyList').innerHTML = '<p class="note">Memuatkan...</p>';
  $('historyDialog').showModal();
  const {data, error} = await sb.from('inventory_stock_logs')
    .select('previous_qty,new_qty,change_type,note,changed_by,created_at')
    .eq('inventory_item_id', item.id)
    .order('created_at', {ascending: false})
    .limit(30);
  if (error) { $('historyList').innerHTML = `<p class="note">Gagal baca sejarah: ${safe(error.message)}</p>`; return; }
  if (!data.length) { $('historyList').innerHTML = '<p class="note">Tiada sejarah lagi.</p>'; return; }
  $('historyList').innerHTML = data.map(l => {
    const who = l.changed_by === user.id ? 'Anda' : (people.has(l.changed_by) ? roleName(people.get(l.changed_by)) : 'Ahli outlet');
    const when = new Date(l.created_at).toLocaleString('ms-MY', {dateStyle: 'medium', timeStyle: 'short'});
    return `<div class="log"><b>${num(l.previous_qty)} → ${num(l.new_qty)} ${safe(item.unit)}</b><br>
      <span>${safe(when)} · ${safe(who)}${l.note ? ' · ' + safe(l.note) : ''}</span></div>`;
  }).join('');
};

// ---------- Copy ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    return ok;
  }
}
const outletName = () => $('outlet').selectedOptions[0]?.textContent || '';

// Senarai beli ringkas untuk WhatsApp: "Ayam 6 kg"
$('copyList').onclick = async () => {
  await flushAll();
  const perlu = items.filter(x => kurangOf(x) > 0);
  if (!perlu.length) { say('Semua stok cukup. Tiada apa perlu dibeli.'); return; }
  const text = [outletName(), ...perlu.map(x => `${x.name} ${num(kurangOf(x))} ${x.unit}`)].join('\n');
  say(await copyText(text) ? `Senarai beli disalin (${perlu.length} barang). Tampal ke WhatsApp.` : 'Gagal salin. Cuba lagi.');
};

const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
$('copyCsv').onclick = async () => {
  await flushAll();
  if (!items.length) { say('Tiada barang untuk disalin.'); return; }
  const rows = [['Outlet', 'Nama', 'Unit', 'Ada', 'Patut ada', 'Kurang', 'Status']];
  items.forEach(x => rows.push([outletName(), x.name, x.unit, x.current_qty, x.target_qty, kurangOf(x), statusLabel[status(x)]]));
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
  say(await copyText(csv) ? `CSV disalin (${items.length} barang). Tampal ke Google Sheets.` : 'Gagal salin. Cuba lagi.');
};

// ---------- Login / logout ----------
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  say('Sedang log masuk...');
  const {data, error} = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('password').value});
  if (error) { say('Emel atau kata laluan salah.'); return; }
  $('password').value = '';
  say('');
  await loadAccount(data.user);
});
$('logout').onclick = async () => { await flushAll(); await sb.auth.signOut(); location.reload(); };
$('outlet').onchange = () => { say(''); refresh(); };
$('refresh').onclick = () => { say(''); refresh(); };

start().catch(e => say('Ralat aplikasi: ' + e.message));
</script>
